<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 599" role="img" aria-labelledby="title desc">
<title id="title">How GPU and CPU state reach persistent storage</title><desc id="desc">Data moves from GPU VRAM to driver-managed host RAM, then CRIU writes required process state as image files. Buffered writes may remain in Linux page cache, which is also RAM. Fsync requests and waits for storage writeback acknowledgement; it does not copy data to another instance. CPU state and kernel resource descriptions also contribute to the CRIU image.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#375f83"/></marker></defs>
<style>text { font-family: Georgia, "Times New Roman", serif; fill: #242424; font-size: 18px; } .label { font-size: 16px; fill: #375f83; }</style>
<rect width="440" height="599" fill="#faf9f6"/>
<rect x="20" y="20" width="400" height="80" rx="4" fill="#f0eee9" stroke="#b2afa6"/>
<text x="220" y="49" text-anchor="middle">GPU memory — VRAM</text>
<text x="220" y="76" text-anchor="middle">Weights, optimizer tensors, CUDA state</text>
<path d="M40 103 V149" fill="none" stroke="#375f83" stroke-width="2" marker-end="url(#arrow)"/>
<text class="label" x="57" y="131">NVIDIA performs the device-to-host copy</text>
<rect x="20" y="154" width="400" height="105" rx="4" fill="#f0eee9" stroke="#b2afa6"/>
<text x="220" y="183" text-anchor="middle">Host memory — RAM</text>
<text x="220" y="210" text-anchor="middle">Driver-managed copy of GPU data</text>
<text x="220" y="234" text-anchor="middle">CPU state is captured alongside it</text>
<path d="M40 262 V308" fill="none" stroke="#375f83" stroke-width="2" marker-end="url(#arrow)"/>
<text class="label" x="57" y="290">CRIU writes images of required state</text>
<rect x="20" y="313" width="400" height="105" rx="4" fill="#f0eee9" stroke="#b2afa6"/>
<text x="220" y="342" text-anchor="middle">Linux page cache — still RAM</text>
<text x="220" y="369" text-anchor="middle">CRIU image-file writes can wait here</text>
<text x="220" y="393" text-anchor="middle">A visible filename is not a durability proof</text>
<path d="M40 421 V467" fill="none" stroke="#375f83" stroke-width="2" marker-end="url(#arrow)"/>
<text class="label" x="57" y="449">Writeback; fsync waits for completion</text>
<rect x="20" y="472" width="400" height="105" rx="4" fill="#e9eef1" stroke="#b2afa6"/>
<text x="220" y="501" text-anchor="middle">Backing storage volume</text>
<text x="220" y="528" text-anchor="middle">SSD / attached block storage</text>
<text x="220" y="552" text-anchor="middle">Storage acknowledges completed writes</text>
</svg>
