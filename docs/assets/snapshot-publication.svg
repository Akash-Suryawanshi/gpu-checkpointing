<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 465" role="img" aria-labelledby="title desc">
<title id="title">The order for publishing a completed snapshot</title><desc id="desc">First fsync the immutable image payload and its directories. Next persist the manifest and snapshot directory and parent. Finally persist the completion record and its directory entry. The command reports success only after the last required sync succeeds. Arrows mean ordering dependencies.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#375f83"/></marker></defs>
<style>text { font-family: Georgia, "Times New Roman", serif; fill: #242424; font-size: 18px; } .label { font-size: 16px; fill: #375f83; }</style>
<rect width="440" height="465" fill="#faf9f6"/>
<rect x="20" y="20" width="400" height="105" rx="4" fill="#f0eee9" stroke="#b2afa6"/>
<text x="220" y="49" text-anchor="middle">1. Persist the payload</text>
<text x="220" y="76" text-anchor="middle">fsync image files and before.json</text>
<text x="220" y="100" text-anchor="middle">fsync image directories</text>
<path d="M40 128 V174" fill="none" stroke="#375f83" stroke-width="2" marker-end="url(#arrow)"/>
<text class="label" x="57" y="156">All required files have finished writing</text>
<rect x="20" y="179" width="400" height="105" rx="4" fill="#f0eee9" stroke="#b2afa6"/>
<text x="220" y="208" text-anchor="middle">2. Persist the description</text>
<text x="220" y="235" text-anchor="middle">Write + fsync + rename manifest</text>
<text x="220" y="259" text-anchor="middle">fsync snapshot directory and parent</text>
<path d="M40 287 V333" fill="none" stroke="#375f83" stroke-width="2" marker-end="url(#arrow)"/>
<text class="label" x="57" y="315">Manifest names the verified payload</text>
<rect x="20" y="338" width="400" height="105" rx="4" fill="#e9eef1" stroke="#b2afa6"/>
<text x="220" y="367" text-anchor="middle">3. Publish completion last</text>
<text x="220" y="394" text-anchor="middle">Write + fsync + rename COMPLETE</text>
<text x="220" y="418" text-anchor="middle">fsync its directory; then report success</text>
</svg>
