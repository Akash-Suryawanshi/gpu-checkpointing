<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Jarvis Labs H100 vLLM activation time</title>
  <desc id="desc">Median cold time to first token was 19.606 seconds. Median snapshot time was 10.895 seconds, 8.710 seconds or 44.4 percent lower.</desc>
  <style>
    text { font-family: Georgia, 'Times New Roman', serif; fill: #242424; }
    .heading { font-size: 25px; }
    .label { font-size: 20px; }
    .value { font-size: 19px; font-weight: bold; }
    .small { font-size: 16px; fill: #52616b; }
    .grid { stroke: #d9e2ec; stroke-width: 1; }
  </style>
  <rect width="960" height="390" fill="#faf9f6"/>
  <text x="45" y="48" class="heading">Median time to first token — three blocks</text>
  <line x1="220" y1="85" x2="220" y2="300" class="grid"/>
  <line x1="380" y1="85" x2="380" y2="300" class="grid"/>
  <line x1="540" y1="85" x2="540" y2="300" class="grid"/>
  <line x1="700" y1="85" x2="700" y2="300" class="grid"/>
  <line x1="860" y1="85" x2="860" y2="300" class="grid"/>
  <text x="220" y="325" text-anchor="middle" class="small">0 s</text>
  <text x="380" y="325" text-anchor="middle" class="small">5 s</text>
  <text x="540" y="325" text-anchor="middle" class="small">10 s</text>
  <text x="700" y="325" text-anchor="middle" class="small">15 s</text>
  <text x="860" y="325" text-anchor="middle" class="small">20 s</text>
  <text x="45" y="143" class="label">Cold start</text>
  <rect x="220" y="105" width="627" height="58" rx="8" fill="#829ab1"/>
  <text x="825" y="142" text-anchor="end" fill="#ffffff" class="value">19.606 s</text>
  <text x="45" y="243" class="label">Snapshot</text>
  <rect x="220" y="205" width="349" height="58" rx="8" fill="#3d7a68"/>
  <text x="547" y="242" text-anchor="end" fill="#ffffff" class="value">10.895 s</text>
  <line x1="569" y1="282" x2="847" y2="282" stroke="#b44b4b" stroke-width="3"/>
  <line x1="569" y1="273" x2="569" y2="291" stroke="#b44b4b" stroke-width="3"/>
  <line x1="847" y1="273" x2="847" y2="291" stroke="#b44b4b" stroke-width="3"/>
  <text x="708" y="305" text-anchor="middle" class="small">8.710 s saved (44.4%)</text>
  <text x="45" y="365" class="small">Same model revision, cache conditions, prompt, and 16 output tokens in every run.</text>
</svg>
